# ─────────────────────────────────────────────────────────────────────────────
# OpenIngest Pipeline Configuration
# ─────────────────────────────────────────────────────────────────────────────

# Cron schedule used by both the built-in scheduler and the Airflow DAG.
# Presets: @hourly | @daily | @midnight | @weekly | @monthly
# Or any 5-field cron expression: "0 6 * * 1-5"
cron: "0 0 * * *"
schedule: "@daily"

