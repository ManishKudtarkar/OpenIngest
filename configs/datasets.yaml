datasets:

# ─────────────────────────────────────────────────────────────────────────────
# Air Quality Datasets — S3 bucket: demos212
# ─────────────────────────────────────────────────────────────────────────────

  air_full_raw:
    source:
      type: s3
      bucket: demos212
      key: Air_full-Raw.csv
      aws_access_key_id: ${AWS_ACCESS_KEY_ID}
      aws_secret_access_key: ${AWS_SECRET_ACCESS_KEY}
      region: ap-south-1
    staging_table: stg_air_full_raw
    load_strategy: replace
    required_columns: []

  air_clean:
    source:
      type: s3
      bucket: demos212
      key: Air-Clean.csv
      aws_access_key_id: ${AWS_ACCESS_KEY_ID}
      aws_secret_access_key: ${AWS_SECRET_ACCESS_KEY}
      region: ap-south-1
    staging_table: stg_air_clean
    load_strategy: replace
    required_columns: []

