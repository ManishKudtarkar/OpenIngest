datasets:
  customers:
    type_checks:
      customer_id: integer
      age: integer
      email: string
      signup_date: datetime

    range_checks:
      age:
        min: 0
        max: 120

    regex_checks:
      email: '^[^@\s]+@[^@\s]+\.[^@\s]+$'

    custom_rules:
      - name: customer_email_not_placeholder
        condition: "email.str.lower() != 'test@example.com'"
        message: "Customer email must not be a placeholder"

  orders:
    type_checks:
      order_id: integer
      customer_id: integer
      subtotal_usd: number
      total_usd: number
      order_time: datetime

    range_checks:
      subtotal_usd:
        min: 0
      total_usd:
        min: 0

  products:
    type_checks:
      product_id: string
      price_usd: number
      stock_qty: integer

    range_checks:
      price_usd:
        min: 0
      stock_qty:
        min: 0
