[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openingest"
version = "3.0.4"
description = "Configuration-driven data ingestion framework with quality checks, metadata, and orchestration"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Manish Kudtarkar", email = "manishkudtarkar467@gmail.com" }
]
license = { text = "MIT" }
keywords = [
  "data engineering", "ETL", "ELT", "data pipeline", "ingestion",
  "airflow", "postgresql", "yaml", "open-source", "data quality",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Database",
]
dependencies = [
  "pandas",
  "sqlalchemy",
  "psycopg2-binary",
  "python-dotenv",
  "PyYAML==6.0.2"
]

[project.urls]
Homepage = "https://openingest.vercel.app"
Repository = "https://github.com/ManishKudtarkar/OpenIngest"
"Bug Tracker" = "https://github.com/ManishKudtarkar/OpenIngest/issues"
Changelog = "https://github.com/ManishKudtarkar/OpenIngest/releases"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.10"
]
web = [
  "streamlit>=1.36"
]
excel = [
  "openpyxl>=3.1.2"
]
parquet = [
  "pyarrow>=15.0"
]
s3 = [
  "boto3>=1.34.0"
]
azure = [
  "azure-storage-blob>=12.19.0"
]
gcs = [
  "google-cloud-storage>=2.14.0"
]
api = [
  "requests>=2.31.0"
]
notifications = [
  "requests>=2.31.0"
]
postgresql = [
  "psycopg2-binary>=2.9.0"
]
mysql = [
  "PyMySQL>=1.1.0"
]
mongodb = [
  "pymongo>=4.6.0"
]
sftp = [
  "paramiko>=3.4.0"
]
salesforce = [
  "simple-salesforce>=1.12.0"
]
hubspot = [
  "requests>=2.31.0"
]
stripe = [
  "requests>=2.31.0"
]
google_sheets = [
  "google-api-python-client>=2.120.0",
  "google-auth>=2.28.0",
  "google-auth-httplib2>=0.2.0",
]
connectors = [
  "PyMySQL>=1.1.0",
  "pymongo>=4.6.0",
  "paramiko>=3.4.0",
  "simple-salesforce>=1.12.0",
  "requests>=2.31.0",
  "google-api-python-client>=2.120.0",
  "google-auth>=2.28.0",
  "google-auth-httplib2>=0.2.0",
]
v2 = [
  "openpyxl>=3.1.2",
  "pyarrow>=15.0",
  "boto3>=1.34.0",
  "azure-storage-blob>=12.19.0",
  "google-cloud-storage>=2.14.0",
  "requests>=2.31.0",
]
all = [
  "openpyxl>=3.1.2",
  "pyarrow>=15.0",
  "boto3>=1.34.0",
  "azure-storage-blob>=12.19.0",
  "google-cloud-storage>=2.14.0",
  "requests>=2.31.0",
  "streamlit>=1.36",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.10",
  "PyMySQL>=1.1.0",
  "pymongo>=4.6.0",
  "paramiko>=3.4.0",
  "simple-salesforce>=1.12.0",
  "google-api-python-client>=2.120.0",
  "google-auth>=2.28.0",
  "google-auth-httplib2>=0.2.0",
]

[project.scripts]
openingest = "openingest.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["openingest*", "core*", "models*", "utils*", "scripts*"]
exclude = ["data*", "sql*", "dags*", "docs*", "tests*"]

[tool.setuptools.package-data]
"openingest.templates" = [
  "project/**",
  "project/.env",
  "project/.openingest",
  "project/**/.gitkeep",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
exclude = ["build"]
